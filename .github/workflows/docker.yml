name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TIC-80 WASM
        uses: ./.github/actions/build-wasm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}

  # Rolls this runtime so it picks up the image the build just pushed. One
  # Deployment serves every CTFd instance, so there is exactly one to restart
  # and no list to keep here.
  #
  # `needs: build` is what makes it conditional on a successful build, and
  # the `if` keeps it to main: this workflow also fires on tags and on pull
  # requests, which publish nothing the cluster should take.
  #
  # The Deployment pulls on every start (imagePullPolicy: Always in jumper-k3s),
  # so a restart is the whole operation.
  restart-k3s:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: ${{ secrets.K3S_URL }}
                insecure-skip-tls-verify: true
              name: k3s
          contexts:
            - context:
                cluster: k3s
                user: k3s-user
              name: k3s
          current-context: k3s
          users:
            - name: k3s-user
              user:
                token: ${{ secrets.K3S_TOKEN }}
          KUBECONFIG
          chmod 600 ~/.kube/config

      - name: Restart the tic80 runtime
        run: |
          set -euo pipefail
          kubectl rollout restart deploy/tic80-runtime -n ctfd-runtimes
          kubectl rollout status deploy/tic80-runtime -n ctfd-runtimes --timeout=300s
